version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-custom
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: my-node-container
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    env_file:
      - mysecret.env
    depends_on:
      - mongodb

volumes:
  mongo_data:


